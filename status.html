<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비레스 지도 공개 상태</title><style>body{max-width:680px;margin:50px auto;padding:20px;background:#12201c;color:#e8e2ca;font:18px/1.8 system-ui}a{color:#e8d995}</style><h1>비레스 지도</h1><p>20개 권역, 166개 거점, 225장의 지도를 공개합니다. 국가·생활권·도시·시설을 단계별로 살펴볼 수 있습니다.</p><p>현재 합의한 지도 제작 범위는 완료됐습니다. 극대 확대에서는 일부 작은 지형 이음 흔적이 남아 있습니다. 길의 물리적 폭·여행 시간·모든 통행 가능 여부는 아직 확정되지 않았습니다.</p><p>표시된 구획은 상세 지도로 들어가는 탐색 범위이며, 모든 구획이 실제 영토 경계를 뜻하지는 않습니다. 상세 이미지는 원본 해상도와 화질을 유지합니다.</p><p>최신 공개 반영 시점: <span id="date">확인 중</span></p><p><a href="index.html#world">전체 지도로 돌아가기</a></p><script>fetch('asset-manifest.json').then(r=>r.json()).then(d=>document.getElementById('date').textContent=new Date(d.updatedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국 시간)')</script></html>
