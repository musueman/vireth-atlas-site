<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비레스 지도 제작 상태</title><style>body{max-width:680px;margin:50px auto;padding:20px;background:#12201c;color:#e8e2ca;font:18px/1.8 system-ui}a{color:#e8d995}</style><h1>비레스 지도 작업본</h1><p>국가·생활권·도시·시설을 단계별로 살펴보는 제작 중인 지도입니다. 지형 접합, 경계, 접근길과 건축 표현은 계속 보완하고 있습니다.</p><p>표시된 구획은 상세 지도로 들어가는 탐색 범위이며, 모든 구획이 실제 영토 경계를 뜻하지는 않습니다. 준비 중인 장소는 개별 상세도가 아직 없습니다.</p><p>최신 공개 반영 시점: <span id="date">확인 중</span></p><p><a href="index.html#world">전체 지도로 돌아가기</a></p><script>fetch('asset-manifest.json').then(r=>r.json()).then(d=>document.getElementById('date').textContent=new Date(d.updatedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국 시간)')</script></html>
